[project]
name = "garmin-workouts"
version = "0.1.0"
description = "Define strength + running workouts as YAML and push them to Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
gwk = "gwk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gwk"]
